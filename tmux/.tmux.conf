# Set prefix to Ctrl+Space (easier than Ctrl+B)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse support
set -g mouse on

# Start windows and panes at 1 not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback
set -g history-limit 10000

# Split panes with | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes with vim keys. -Z "keeps the window zoomed if it was zoomed", so
# once you're full screen you stay full screen while hopping between panes --
# without it every move drops you back to the split layout and you have to press
# z again. On an unzoomed window it changes nothing.
bind h select-pane -L -Z
bind j select-pane -D -Z
bind k select-pane -U -Z
bind l select-pane -R -Z

# The same moves with no prefix at all: M-h/j/k/l. Alt is free here -- nvim uses
# C-w for its own splits and wezterm binds nothing -- so this is the whole
# journey in one keystroke instead of three.
# M-o -- flip what M-h/j/k/l steer: tmux panes, or the windows INSIDE the
# program in this pane (nvim's splits: the dap sidebar, diffview's file panel,
# neo-tree, quickfix).
#
# The toggle has to live here rather than in nvim, because `bind -n` means tmux
# consumes M-h before the program ever sees it -- so "let nvim have them" is
# something only tmux can decide.
#
# A user option and four conditional bindings, NOT a key-table. `set key-table`
# would be the idiomatic way to hold a mode, but the table it switches to has to
# re-bind everything you still want: the prefix, M-H/M-L, M-u/M-d, M-z, the
# arrows. Four `if -F` conditions leave all of that alone.
#
# @panemode is unset by default, and an unset user option formats as empty,
# which #{?...} reads as false -- so tmux keeps the panes on a fresh server with
# nothing to initialise.
# M-o and not M-Space: Windows takes Alt+Space for the window system menu, so it
# never reaches WezTerm, let alone tmux.
#
# refresh-client -S redraws the status line NOW. status-interval is unset here,
# so it defaults to 15 seconds -- without this the indicator appears up to
# fifteen seconds after the mode changed, which reads as the key doing nothing.
bind -n M-o if -F '#{@panemode}' \
  'set -gu @panemode ; refresh-client -S ; display -d 900 "M-hjkl: tmux panes"' \
  'set -g @panemode 1 ; refresh-client -S ; display -d 900 "M-hjkl: nvim windows"'

# Sent with the M- modifier intact, so nvim receives <M-h> and maps it to its
# own window motions. In a plain shell the key does nothing, which is the same
# as it did before this existed.
bind -n M-h if -F '#{@panemode}' 'send-keys M-h' 'select-pane -L -Z'
bind -n M-j if -F '#{@panemode}' 'send-keys M-j' 'select-pane -D -Z'
bind -n M-k if -F '#{@panemode}' 'send-keys M-k' 'select-pane -U -Z'
bind -n M-l if -F '#{@panemode}' 'send-keys M-l' 'select-pane -R -Z'

# Alt+arrows do the same, for when a hand is already on the arrows. `bind -n`
# takes a key from whatever runs inside the pane, so the letters were checked
# against zsh first: this shell is in VI mode, where the only Alt bindings are
# M-, M-/ M-c M-~ (history completion and fzf-cd). h/j/k/l/z/1-5 are all free.
bind -n M-Left  select-pane -L -Z
bind -n M-Down  select-pane -D -Z
bind -n M-Up    select-pane -U -Z
bind -n M-Right select-pane -R -Z

# Zoom toggle without the prefix, to match.
bind -n M-z resize-pane -Z

# Jump straight to pane N, full screen, from anywhere. -Z on select-pane only
# PRESERVES an existing zoom, so an unzoomed window needs the explicit toggle --
# hence the conditional, which would otherwise unzoom when already zoomed.
bind -n M-1 if -F '#{window_zoomed_flag}' 'select-pane -t 1 -Z' 'select-pane -t 1 ; resize-pane -Z'
bind -n M-2 if -F '#{window_zoomed_flag}' 'select-pane -t 2 -Z' 'select-pane -t 2 ; resize-pane -Z'
bind -n M-3 if -F '#{window_zoomed_flag}' 'select-pane -t 3 -Z' 'select-pane -t 3 ; resize-pane -Z'
bind -n M-4 if -F '#{window_zoomed_flag}' 'select-pane -t 4 -Z' 'select-pane -t 4 ; resize-pane -Z'
bind -n M-5 if -F '#{window_zoomed_flag}' 'select-pane -t 5 -Z' 'select-pane -t 5 ; resize-pane -Z'

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows, not panes, for anything long-lived (claude, nvim, a dev server).
# A pane changes size every time you zoom or split, and a program drawing into
# the NORMAL screen buffer -- a shell, claude -- doesn't re-anchor when that
# happens: its output stays where it was and you're left scrolling to find it.
# Full-screen programs that take the ALTERNATE buffer (nvim, less, htop) redraw
# on every resize and never show this. A tmux window is always the full terminal
# size, so switching windows resizes nothing and the pane is correct on arrival.
# Alt+Shift+h/l to move between them, mirroring Alt+h/l for panes.
bind -n M-H previous-window
bind -n M-L next-window

# last-window, which lost its default `prefix l` when l became select-pane.
bind \; last-window

# <prefix>C -- the config window: claude, in ~/dotfiles, carrying on from
# whatever we were last asking it about there. Three keystrokes' worth of
# new-window / cd / claude, in one.
#
# A window rather than a pane, for the reason the block above gives: claude
# draws into the normal screen buffer, so a pane that changes size leaves its
# output stranded where it was.
#
# `claude --continue` resumes the most recent conversation for the DIRECTORY it
# starts in -- and starts a fresh one when there is nothing to resume -- so the
# same command covers both cases and there is no fallback to write.
#
# Three states, hence the two conditionals:
#   already in it     -> last-window, so the same key is also the way back
#   exists elsewhere  -> select it. `=name` is an exact match; a bare name is a
#                        prefix match, which would also catch `claude-cfg-old`
#   not there at all  -> make it
# The `cd` lives in the shell command rather than in new-window -c because tmux
# only expands a lone `~`: `-c ~/dotfiles` silently lands you in $HOME.
# Nothing runs after claude on purpose -- quitting it closes the window, so the
# next <prefix>C is a clean --continue instead of finding a dead shell still
# holding the name.
bind C if -F '#{==:#{window_name},claude-cfg}' 'last-window' {
  if-shell "tmux list-windows -F '##{window_name}' | grep -qx claude-cfg" \
           'select-window -t =claude-cfg' \
           'new-window -n claude-cfg "cd ~/dotfiles && exec claude --continue"'
}

# Scrolling without the mouse. tmux owns the scrollback, so this is the same key
# in a bare shell and inside a full TUI like claude -- the binding is consumed by
# tmux and the program never sees it, which is why claude needs no support for it.
# copy-mode -u enters copy mode ALREADY scrolled up a page, so it's one keystroke
# rather than `prefix [` then C-u. Once in there it's vim: k/j, C-u/C-d, C-b/C-f,
# g/G for the ends of the history, / to search, q to leave.
# M-u is the one to reach for on a laptop: PageUp there is Fn+Up, which is a
# two-handed stretch for something you do constantly. Alt+u goes up into the
# scrollback, Alt+d comes back down, and both repeat while you hold Alt. Inside
# copy mode C-u/C-d still give half pages, so the two sets complement rather
# than duplicate. Free in this zsh (vi mode binds only M-, M-/ M-c M-~).
#
# Guarded on #{alternate_on}: a program on the ALTERNATE screen (claude, nvim,
# less) keeps its own history and writes nothing to tmux's, so entering copy
# mode there shows the shell output from BEFORE it started -- a few dozen stale
# lines that stop dead, which looks like a broken scroll limit. In those panes
# the key is forwarded to the program instead, and scrolling is the program's
# own job. Only a shell, on the normal screen, has scrollback worth this.
bind -n M-u if -F '#{alternate_on}' 'send-keys M-u' 'copy-mode -u'
bind -n M-d if -F '#{alternate_on}' 'send-keys M-d' ''
bind -T copy-mode-vi M-u send -X page-up
bind -T copy-mode-vi M-d send -X page-down

# Shift+PageUp does the same, for when the laptop is docked to a full keyboard.
bind -n S-PPage if -F '#{alternate_on}' 'send-keys S-PPage' 'copy-mode -u'
bind -T copy-mode-vi S-PPage send -X page-up
bind -T copy-mode-vi S-NPage send -X page-down

# vi keys in copy mode. Already the default here, but only because tmux infers it
# from $EDITOR being nvim -- set it so it can't change underfoot.
setw -g mode-keys vi

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# True colour
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar
set -g status-position bottom
set -g status-style 'bg=#1a1b26 fg=#7aa2f7'
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold] #S '
# The mode M-hjkl is in, before the clock. Only shown when it is NOT the
# default: panes are the normal state and a permanent "TMUX" label would be
# a word that never changes taking up room. The indicator appearing at all
# is the signal.
set -g status-right '#{?@panemode,#[fg=#1a1b26#,bg=#e0af68#,bold] NVIM WINDOWS #[default],}#[fg=#565f89] %H:%M %d %b '
set -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7] #I #W '
set -g window-status-format '#[fg=#565f89] #I #W '

# Tell programs when their pane gains or loses focus. Off by default, and its
# absence is why nvim's `autoread` looks broken under tmux: nvim re-checks a file
# on FocusGained, and without this that event never arrives, so a buffer edited
# by something in another pane stays stale until you touch it.
set -g focus-events on

# Small escape delay. 0 makes tmux give up mid-read on WezTerm's terminal
# query replies, spilling them into the pane as garbage; 10ms fixes that and
# is imperceptible for <Esc> in vim.
set -sg escape-time 10
